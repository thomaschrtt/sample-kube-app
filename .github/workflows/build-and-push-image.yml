name: Build and push app image

on:
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - app/**
      - bootstrap/**
      - config/**
      - database/**
      - public/**
      - resources/**
      - routes/**
      - composer.json
      - composer.lock
      - package.json
      - webpack.mix.js
      - artisan
      - server.php
      - .github/workflows/build-and-push-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      # Récupérer le code
      - name: Checkout
        uses: actions/checkout@v4

      # Configurer Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Connexion à GHCR
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Générer les tags Docker
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=raw,value=latest

      # Build + Push de l'image
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Récupérer le repository GitOps
      - name: Checkout GitOps repository
        uses: actions/checkout@v4
        with:
          repository: thomaschrtt/sample-kube-app
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops

      # Mettre à jour l'image dans Kubernetes
      - name: Update Kubernetes image
        run: |
          sed -i "s|image: ghcr.io/thomaschrtt/sample-kube-app:.*|image: ghcr.io/thomaschrtt/sample-kube-app:${GITHUB_SHA}|g" \
            k8s/app-deployment.yaml

      # Commit + push du changement GitOps
      - name: Commit and push GitOps changes
        working-directory: gitops
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add deployment.yaml

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Update app image to ${GITHUB_SHA}"
          git push
